name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  cli-build:
    name: CLI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build pagers binary (release)
        run: cargo build --release -p pagers-cli

      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/pagers pagers-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/pagers pagers-aarch64-apple-darwin ;;
            windows-latest) mv target/release/pagers.exe pagers-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pagers-cli-${{ matrix.os }}
          path: pagers-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [cli-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: pagers-cli-*
          merge-multiple: true

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "pagers (latest)" \
            --notes-file README.md \
            --target "$GITHUB_SHA" \
            dist/*

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: packages/landing/pnpm-lock.yaml

      - name: Install landing dependencies
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        working-directory: packages/landing
        run: pnpm run typecheck

      - name: Lint landing
        working-directory: packages/landing
        run: pnpm run lint

      - name: Test landing
        working-directory: packages/landing
        run: pnpm run test

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
