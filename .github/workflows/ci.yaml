name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build pagers binary (release)
        run: cargo build --release -p pagers-cli

      # The deploy steps only run on pushes to master; PRs stop after the build.
      - name: Stage site content
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .page
          cp README.md .page/
          cp -R docs .page/docs
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [[ "$GITHUB_REPOSITORY" == *.github.io ]]; then
            base="/"
            url="https://${owner}.github.io"
          else
            base="/${repo}"
            url="https://${owner}.github.io${base}"
          fi
          printf 'title: pagers\nbasePath: %s\nurl: %s\n' "$base" "$url" > .page/pagers.yaml

      - name: Build site with pagers
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: ./target/release/pagers build .page --output _site

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="latest"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --title "pagers (latest)" \
            --notes-file README.md \
            --target "$GITHUB_SHA" \
            target/release/pagers
