name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build pagers binary (release)
        run: cargo build --release -p pagers-cli

      # The deploy steps only run on pushes to master; PRs stop after the build.
      - name: Setup pnpm
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: packages/landing/pnpm-lock.yaml

      - name: Install landing dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Build landing (Next.js static export)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: packages/landing
        run: pnpm run build

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="latest"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --title "pagers (latest)" \
            --notes-file README.md \
            --target "$GITHUB_SHA" \
            target/release/pagers
