[package]
name = "pagers-wiki"
version = "0.0.1"
edition = "2021"
description = "Wikipedia article → clean Markdown converter"
license = "GPL-3.0"

[dependencies]
htmd = "0.5"
markup5ever = "0.38"
markup5ever_rcdom = "0.38"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
