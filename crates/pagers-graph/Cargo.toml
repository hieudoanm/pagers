[package]
name = "pagers-graph"
version = "0.1.0"
edition = "2021"
description = "Page-link graph extraction and rendering for pagers"
license = "GPL-3.0"

[dependencies]
pagers-markdown = { path = "../pagers-markdown" }
pagers-site = { path = "../pagers-site" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
