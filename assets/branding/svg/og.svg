<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Pager: turn Markdown into a docs site" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Pager</title>
  <rect width="1280" height="640" fill="#F8FAFC"/>

  <!-- logo mark -->
  <g transform="translate(15 94) scale(0.9)">
    <g transform="translate(-24 38)">
      <g fill="none" stroke="#F59E0B" stroke-width="16" stroke-linecap="round">
        <path d="M352 110 A40 40 0 0 1 392 150"/>
        <path d="M352 78 A72 72 0 0 1 424 150"/>
        <path d="M352 46 A104 104 0 0 1 456 150"/>
      </g>
      <rect x="156" y="132" width="120" height="30" rx="10" fill="#111827"/>
      <rect x="96" y="150" width="240" height="240" rx="40" fill="#1F2A44"/>
      <rect x="124" y="180" width="184" height="100" rx="14" fill="#CFF5D8"/>
      <g fill="#1F2A44">
        <rect x="144" y="200" width="144" height="12" rx="6"/>
        <rect x="144" y="226" width="104" height="12" rx="6"/>
        <rect x="144" y="252" width="60" height="12" rx="6"/>
      </g>
      <g fill="#3B4A6B">
        <circle cx="156" cy="336" r="20"/>
        <circle cx="216" cy="336" r="20"/>
        <circle cx="276" cy="336" r="20"/>
      </g>
      <circle cx="216" cy="336" r="8" fill="#F59E0B"/>
    </g>
  </g>

  <!-- text -->
  <rect x="480" y="136" width="64" height="8" rx="4" fill="#F59E0B"/>
  <text x="476" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="124" font-weight="800" fill="#1F2A44">Pager</text>
  <text x="480" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#475569">Turn Markdown into a docs site.</text>
  <text x="480" y="384" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#475569">No build step. Just HTML.</text>

  <!-- pill -->
  <rect x="480" y="430" width="480" height="68" rx="16" fill="#1F2A44"/>
  <text x="512" y="474" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="30" fill="#CFF5D8">README.md  →  index.html</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
