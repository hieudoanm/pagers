  <text x="640" y="47" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#8a8a8a">pagers — zsh</text>
  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers --version</tspan></text>  <text x="44" y="158" fill="#9ca3af">pagers 0.1.0</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers init my-site</tspan></text>  <text x="44" y="222" fill="#7dd3a8">Created my-site/ — 3 pages</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="254"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers build my-site/docs</tspan></text>  <text x="44" y="286" fill="#9ca3af">Building 14 pages…</text>  <text x="44" y="318" fill="#7dd3a8">Wrote my-site/dist (182 KB)</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="350"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers serve my-site/docs --port 8080</tspan></text>  <text x="44" y="382" fill="#7dd3a8">Serving on http://localhost:8080</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="414"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers graph my-site/docs</tspan></text>  <text x="44" y="446" fill="#7dd3a8">Wrote graph.html + graph.json + graph.dot</text>  </g></svg>
