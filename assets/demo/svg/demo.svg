<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img">
  <rect width="1280" height="640" fill="#0b0b0b"/>
  <rect x="12" y="12" width="1256" height="616" rx="28" fill="#141414" stroke="#2e2e2e" stroke-width="2"/>
  <path d="M12 68V40a28 28 0 0 1 28-28h1200a28 28 0 0 1 28 28v28H12Z" fill="#1c1c1c"/>
  <circle cx="56" cy="40" r="8" fill="#ff5f57"/>
  <circle cx="84" cy="40" r="8" fill="#febc2e"/>
  <circle cx="112" cy="40" r="8" fill="#28c840"/>
  <text x="640" y="47" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#8a8a8a">pagers — zsh</text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.80s" dur="0.25s" fill="freeze"/>
    <text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers --version</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.25s" fill="freeze"/>
    <text x="44" y="158" fill="#9ca3af">pagers 0.1.0</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.90s" dur="0.25s" fill="freeze"/>
    <text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers init my-site</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.45s" dur="0.25s" fill="freeze"/>
    <text x="44" y="222" fill="#7dd3a8">Created my-site/ — 3 pages</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.00s" dur="0.25s" fill="freeze"/>
    <text x="44" y="254"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers build my-site/docs</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.55s" dur="0.25s" fill="freeze"/>
    <text x="44" y="286" fill="#9ca3af">Building 14 pages…</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.10s" dur="0.25s" fill="freeze"/>
    <text x="44" y="318" fill="#7dd3a8">Wrote my-site/dist (182 KB)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.65s" dur="0.25s" fill="freeze"/>
    <text x="44" y="350"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers serve my-site/docs --port 8080</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.20s" dur="0.25s" fill="freeze"/>
    <text x="44" y="382" fill="#7dd3a8">Serving on http://localhost:8080</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.75s" dur="0.25s" fill="freeze"/>
    <text x="44" y="414"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">pagers graph my-site/docs</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.30s" dur="0.25s" fill="freeze"/>
    <text x="44" y="446" fill="#7dd3a8">Wrote graph.html + graph.json + graph.dot</text>
  </g>
  <rect x="536" y="427" width="12" height="24" rx="2" fill="#e5e5e5">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1.1s" begin="7.15s" repeatCount="indefinite"/>
  </rect>
